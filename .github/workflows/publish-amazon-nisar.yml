name: Publish Amazon Mamiraua NISAR review data

on:
  push:
    branches:
      - feat/amazon-nisar-discovery
    paths:
      - .github/workflows/publish-amazon-nisar.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve authentic processing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/amazon"
          gh run download 43726476263 --repo "$GITHUB_REPOSITORY" --name amazon-nisar-amazon-mamiraua --dir "$RUNNER_TEMP/amazon"
          test -s "$RUNNER_TEMP/amazon/discovery.json"
          test -s "$RUNNER_TEMP/amazon/processed/manifest.json"
          python - "$RUNNER_TEMP/amazon" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          d=json.loads((root/"discovery.json").read_text())
          m=json.loads((root/"processed/manifest.json").read_text())
          assert d["site"]=="amazon-mamiraua"
          assert d["status"]=="EXPLORATORY_PROCESSED_NOT_QA_CLEARED"
          assert [a["date"] for a in d["selected"]]==["2026-07-07","2026-07-19"]
          assert len(m["frames"])==1
          f=m["frames"][0]
          assert f["id"]=="T161_F176_A"
          assert [a["date"][:10] for a in f["acquisitions"]]==["2026-07-07","2026-07-19"]
          assert len(f["changeLayers"])==3 and not f["mixedVersions"]
          PY
      - name: Commit only science derivatives and source provenance
        run: |
          set -euo pipefail
          target=frontend/public/data/amazon-mamiraua
          mkdir -p "$target"
          cp -R "$RUNNER_TEMP/amazon/processed/." "$target/"
          cp "$RUNNER_TEMP/amazon/discovery.json" "$target/discovery.json"
          if find "$target" -type f \( -name '*.h5' -o -name '*.hdf5' \) | grep -q .; then
            echo "Raw science HDF5 files must not be committed" >&2
            exit 2
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if ! git diff --cached --quiet; then
            git commit -m "Add genuine NISAR Mamiraua Amazon floodplain comparison derivatives"
            git push origin HEAD:feat/amazon-nisar-discovery
          fi
