name: Validate consistent location evidence UI

on:
  push:
    branches:
      - feat/consistent-location-evidence-ui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify all location data and preserve existing UI
        run: npm test
      - run: npm run lint
      - run: npm run build
