name: Discovery Lab Browser Smoke
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: discovery-lab-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked app dependencies
        working-directory: frontend
        run: npm ci
      - name: Install isolated Playwright browser test runner
        working-directory: frontend
        run: |
          npm install --no-save --no-package-lock --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Build static GitHub Pages site
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /SARS
        run: npm run build
      - name: Serve site under actual GitHub Pages subpath
        run: |
          mkdir -p /tmp/sar-waltz-pages/SARS
          cp -a frontend/out/. /tmp/sar-waltz-pages/SARS/
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory /tmp/sar-waltz-pages >/tmp/sar-waltz-server.log 2>&1 &
          sleep 2
      - name: Browser tests - navigation, resizing, panning, scientific labeling
        working-directory: frontend
        run: npx playwright test scripts/discovery-lab.e2e.spec.mjs --reporter=line --workers=1
      - name: Upload browser screenshots and traces if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-lab-browser-failure
          path: frontend/test-results
          if-no-files-found: ignore
