name: Emergency TANGO static site for immediate publishing

on:
  push:
    branches:
      - feat/nisar-hackathon-ready
    paths:
      - .github/workflows/emergency-static-site.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run validated science tests
        run: npm test
      - name: Lint frontend
        run: npm run lint
      - name: Build for a root-domain static host (not GitHub Pages subpath)
        env:
          NEXT_PUBLIC_BASE_PATH: ''
        run: npm run build
      - name: Verify scientific evidence and standalone site assets
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/nisar-prototype.html
          test -f out/etna-investigation.html
          test -f out/data/hawaii-full-evidence/evidence.json
          test -f out/data/etna-event-evidence/evidence.json
          test -f out/data/rodanthe-evidence/evidence.json
          test -f out/data/amazon-evidence/evidence.json
          test -f out/cesium/Cesium.js
          test ! -e out/.env
          echo "The site is a ready-to-host static export (no API credentials)."
      - name: Package standalone static website
        run: |
          cd out
          zip -q -r ../TANGO-site-ready-to-publish.zip .
          cd ..
          test -s TANGO-site-ready-to-publish.zip
          ls -lh TANGO-site-ready-to-publish.zip
      - name: Download this ZIP and drag it onto Netlify Drop
        uses: actions/upload-artifact@v4
        with:
          name: TANGO-site-ready-to-publish
          path: frontend/TANGO-site-ready-to-publish.zip
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
