name: Validate private coordinate NISAR processing

on:
  push:
    branches:
      - feat/coordinate-earthdata-private-processing
    paths:
      - .github/workflows/test-private-coordinate-processing.yml
      - frontend/app/coordinates/page.tsx
      - frontend/components/site-nav.tsx
      - pipeline/private_processing_api.py
      - pipeline/fetch_nisar.py
      - pipeline/generate_unified_evidence.py
      - pipeline/tests/test_private_processing_api.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-and-science:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROCESSING_ALLOWED_ORIGINS: https://tangosars.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install processing and web API dependencies
        run: 'python -m pip install -r pipeline/private-api-requirements.txt'
      - name: Verify Python syntax and private API authorization tests
        run: |
          python -m compileall -q pipeline/private_processing_api.py pipeline/fetch_nisar.py pipeline/generate_unified_evidence.py
          python -m pytest pipeline/tests/test_private_processing_api.py -q
      - name: Smoke test real Rodanthe GCOV derivatives through custom generator
        run: |
          python - <<'PY'
          import tempfile, shutil, json
          from pathlib import Path
          from pipeline.generate_unified_evidence import generate
          with tempfile.TemporaryDirectory() as td:
              target = Path(td)
              shutil.copytree(Path("frontend/public/data/rodanthe-processed"), target / "results")
              generate("custom", target)
              meta = json.loads((target / "custom-evidence/evidence.json").read_text())
              regions = json.loads((target / "custom-regions/regions.json").read_text())
              assert len(regions["regions"]) == 3
              assert len(meta["polarizations"]["HH"]["histogramBins"]) == 48
              assert (target / "custom-preview/20260917_HH.png").is_file()
          PY
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build static export with optional remote worker URL
        env:
          NEXT_PUBLIC_PROCESSING_API_URL: https://worker.example.test
        run: npm run build
