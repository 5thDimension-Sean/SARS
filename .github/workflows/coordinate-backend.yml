name: Coordinate backend regression checks
on:
  pull_request:
    paths:
      - 'pipeline/**'
      - 'frontend/app/coordinates/**'
      - 'frontend/lib/coordinate-request.ts'
      - 'frontend/scripts/coordinate-request.test.mjs'
      - '.github/workflows/coordinate-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROCESSING_ALLOWED_ORIGINS: https://tangosars.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r pipeline/private-api-requirements.txt
      - run: python -m compileall -q pipeline
      - run: python -m pytest pipeline/tests/test_private_processing_api.py pipeline/tests/test_coordinate_contract.py pipeline/tests/test_private_download.py pipeline/tests/test_custom_evidence.py pipeline/tests/test_processing.py pipeline/tests/test_fetch_inspect.py -q
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_PROCESSING_API_URL: https://worker.example.test
