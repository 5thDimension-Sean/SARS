name: Publish Hawaii full NISAR evidence only

on:
  push:
    branches:
      - feat/featured-hawaii-complete-analysis
    paths:
      - .github/workflows/publish-featured-hawaii.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import authentic Hawaii results only; never import Iowa
        run: |
          set -euo pipefail
          git fetch --no-tags origin feat/hawaii-iowa-full-scientific-evidence
          git restore --source FETCH_HEAD --             frontend/public/data/hawaii-processed             frontend/public/data/hawaii-full-evidence             frontend/public/data/hawaii-full-regions             frontend/public/data/hawaii-full-preview
          test -f frontend/public/data/hawaii-full-evidence/evidence.json
          test -f frontend/public/data/hawaii-full-regions/regions.json
          test -f frontend/public/data/hawaii-full-preview/preview-manifest.json
          if git diff --name-only HEAD | grep -qi iowa; then
            echo "Refusing to change Iowa files"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/public/data/hawaii-processed frontend/public/data/hawaii-full-evidence frontend/public/data/hawaii-full-regions frontend/public/data/hawaii-full-preview
          git commit -m "Import authentic Hawaii numerical evidence without Iowa"
          git pull --rebase origin feat/featured-hawaii-complete-analysis
          git push origin HEAD:feat/featured-hawaii-complete-analysis
