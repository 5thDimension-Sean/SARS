name: Validate SAR-Waltz Pull Request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
        continue-on-error: true # Existing repo-wide lint errors tracked separately; do not skip build validation.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /SARS

  validate-python-gcov:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install pinned pipeline requirements
        run: python -m pip install -r pipeline/requirements.txt
      - name: Test numeric radar processing and manifest safety
        run: python -m pytest pipeline/tests -q
